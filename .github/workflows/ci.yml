name: CI

on:
  pull_request:
  push:
    branches: [main, team-a/extension, avneh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npx vitest run
      - name: Route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx next build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_ORION_API: https://api.example.com

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test --if-present
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: extension-dist
          path: extension/dist
          retention-days: 14

  codebase-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: codebase-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: codebase-agent/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac/Constellation
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, smoke test
        run: |
          swift --version
          swift build -c release
          swift test
          .build/release/Constellation --smoke-test

  audit:
    # Known vulnerabilities in production dependencies. Separate job so a new advisory is visible
    # without hiding the build result.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [server, web, extension, codebase-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production deps, high and above)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high

  docker:
    # Builds both deploy images (no push) so a broken Dockerfile shows up on the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          push: false
          tags: orion-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          tags: orion-web:ci
          build-args: NEXT_PUBLIC_ORION_API=https://api.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
