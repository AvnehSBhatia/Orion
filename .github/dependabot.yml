version: 2
updates:
  - package-ecosystem: npm
    directories: ["/server", "/web", "/extension", "/codebase-agent"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR per package for routine minor/patch bumps; majors come one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next and React move together and change APIs between majors; upgrade them by hand.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ["/deploy"]
    schedule:
      interval: weekly
