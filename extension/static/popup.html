<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orion</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { width: 400px; min-height: 0; padding: 24px; }
    body.hiding { width: 720px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }

    /* "Live" pill with a pulsing dot, shown only while recording. */
    .live {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 92, 122, 0.12);
      border: 1px solid rgba(255, 92, 122, 0.35);
      color: #ffb3c1;
      font-size: 14px;
      font-weight: 600;
    }
    body.recording .live { display: inline-flex; }
    .live .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); }
    .live .dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--alert);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      from { transform: scale(0.6); opacity: 0.9; }
      to { transform: scale(1.6); opacity: 0; }
    }

    body.recording #toggle {
      background: var(--alert);
      color: #1a0b10;
      box-shadow: 0 8px 24px -12px rgba(255, 92, 122, 0.8);
    }

    #status { min-height: 24px; margin: 16px 0 0; font-size: 16px; color: var(--muted); }
    #status:empty { display: none; }
    #status[data-tone="ok"] { color: var(--text); }
    #status[data-tone="error"] { color: var(--alert); }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* While recording, "Change what is shared" takes the place of "Hide something". */
    #change { display: none; }
    body.recording #change { display: inline; }
    body.recording #hide { display: none; }

    #hide-panel { display: none; }
    body.hiding #hide-panel { display: block; }
    body.hiding #toggle, body.hiding footer { display: none; }

    #setup { display: none; }
    body.setup #setup { display: block; }
    body.setup #toggle, body.setup #hide { display: none; }
    #setup .primary { margin-top: 0; }

    /* Signed out: the only action is signing in again. */
    #signin-panel { display: none; }
    body.signed-out #signin-panel { display: block; }
    body.signed-out #toggle { display: none; }

    /* The monitoring notice, shown before the first capture. */
    #consent-panel { display: none; }
    body.consent #consent-panel { display: block; }
    body.consent #toggle, body.consent footer, body.consent .controls { display: none; }
    #consent-panel h2 { font-size: 18px; margin: 0 0 8px; }
    .notice {
      max-height: 260px;
      overflow-y: auto;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    #consent-panel .secondary { width: 100%; margin-top: 8px; }

    /* Pause and per-site controls. */
    .controls { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
    .controls .row { flex-wrap: wrap; justify-content: flex-start; }
    .chip {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
    }
    #pause-row, #paused-row, #site-row { display: none; }
    body.recording:not(.paused) #pause-row { display: flex; }
    body.paused #paused-row { display: flex; }
    body.has-site #site-row { display: flex; }
    body.hiding .controls, body.setup .controls { display: none; }
    #site-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.paused .live { background: rgba(122, 131, 153, 0.15); border-color: rgba(122, 131, 153, 0.4); color: var(--muted); }
    body.paused .live .dot, body.paused .live .dot::after { background: var(--muted); border-color: var(--muted); animation: none; }

    #shot {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      cursor: crosshair;
      touch-action: none;
    }
    #hide-panel .row { margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <line x1="6" y1="29" x2="15" y2="14" />
        <line x1="15" y1="14" x2="26" y2="19" />
        <line x1="26" y1="19" x2="34" y2="7" />
        <line x1="26" y1="19" x2="31" y2="33" />
        <circle cx="6" cy="29" r="2.5" fill="#E3C26B" />
        <circle cx="15" cy="14" r="3" fill="#6EA8FF" />
        <circle cx="26" cy="19" r="3.5" fill="#F2F4F8" />
        <circle cx="34" cy="7" r="2.5" fill="#5EEAD4" />
        <circle cx="31" cy="33" r="2.5" fill="#FF9F6E" />
      </svg>
      <div>
        <h1>Orion</h1>
        <p class="tagline">Your work, on the team map</p>
      </div>
    </div>
    <span class="live" aria-hidden="true"><span class="dot"></span>Live</span>
  </header>

  <button id="toggle" class="primary">Start capturing</button>

  <div id="signin-panel">
    <button id="sign-in-again" class="primary">Sign in again</button>
  </div>

  <section id="consent-panel" aria-labelledby="consent-title">
    <h2 id="consent-title">Before you start capturing</h2>
    <div id="notice-text" class="notice card" tabindex="0"></div>
    <button id="accept" class="primary">I understand, start capturing</button>
    <button id="decline" class="secondary">Not now</button>
  </section>

  <form id="setup">
    <label for="user-id">Your user id</label>
    <input id="user-id" required autocomplete="off" placeholder="for example, priya-pm" />
    <button type="submit" class="primary">Save</button>
  </form>

  <div id="hide-panel">
    <canvas id="shot"></canvas>
    <div class="row">
      <div class="row">
        <button id="undo" class="secondary">Undo</button>
        <button id="cancel" class="secondary">Cancel</button>
      </div>
      <button id="send-hidden" class="secondary">Send with hidden areas</button>
    </div>
  </div>

  <div id="status" role="status"></div>

  <div class="controls">
    <div id="pause-row" class="row">
      <span>Pause for</span>
      <button class="chip" data-pause="15">15 min</button>
      <button class="chip" data-pause="60">1 hour</button>
      <button class="chip" data-pause="0">Until I resume</button>
    </div>
    <div id="paused-row" class="row">
      <span id="paused-text"></span>
      <button id="resume" class="chip">Resume</button>
    </div>
    <div id="site-row" class="row">
      <span id="site-text"></span>
      <button id="site-toggle" class="chip">Never capture this site</button>
    </div>
  </div>

  <footer id="links" class="row">
    <a id="hide" class="link" href="#">Hide something</a>
    <a id="change" class="link" href="#">Change what is shared</a>
    <a id="settings" class="link" href="#">Settings</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
