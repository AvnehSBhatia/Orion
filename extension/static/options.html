<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orion settings</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height: 100vh; padding: 56px 16px; }
    main { max-width: 460px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    .logo { width: 56px; height: 56px; }
    .wordmark { font-size: 26px; }
    .card + .card { margin-top: 12px; }
    h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .actions { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
    .actions .primary { width: auto; padding: 11px 22px; }
    #status { color: var(--muted); font-size: 13px; }
    #status[data-tone="ok"] { color: var(--ok); }
    #status[data-tone="error"] { color: var(--alert); }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <div id="logo" class="logo" aria-hidden="true"></div>
      <div class="brand-text">
        <h1 class="wordmark reveal">Orion</h1>
        <div id="who" class="subtle reveal">Settings</div>
      </div>
    </header>

    <form id="form" novalidate>
      <section class="card reveal">
        <h2>You</h2>
        <label for="orgId">Org id</label>
        <input id="orgId" required autocomplete="off" spellcheck="false" placeholder="demo" />
        <div id="org-hint" class="hint"></div>
        <label for="name">Your name</label>
        <input id="name" required autocomplete="name" placeholder="Priya Shah" />
        <label for="role">What you do, in one sentence</label>
        <textarea id="role" required maxlength="400" placeholder="I run paid ads and own the launch budget."></textarea>
      </section>

      <section class="card reveal">
        <h2>Server</h2>
        <label for="backendUrl">Orion URL</label>
        <input id="backendUrl" type="url" required spellcheck="false" placeholder="http://localhost:3001" />
      </section>

      <div class="actions reveal">
        <button id="save" type="submit" class="primary">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
