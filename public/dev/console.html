<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orion</title>
  <!-- Developer console: ask Orion and watch your feed. Stand-in until the real frontend exists.
       Open /dev/console.html?org=<orgId>&user=<userId>. Same origin as the API, so the extension never captures it. -->
  <style>
    :root { color-scheme: dark; --bg:#07081a; --panel:rgba(255,255,255,.035); --edge:rgba(255,255,255,.08); --edge2:rgba(255,255,255,.13); --text:#eceeff; --muted:#9097bf; --faint:#5d6390; --violet:#8b7bff; --blue:#5d8bff; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; overflow:hidden; color:var(--text); font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
      background: radial-gradient(70% 55% at 35% -15%, rgba(124,108,255,.26), transparent 62%), radial-gradient(50% 40% at 100% 100%, rgba(80,140,255,.12), transparent 70%), var(--bg); }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
      background-image: radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 72% 12%, #c9c2ff 50%, transparent 51%), radial-gradient(1px 1px at 38% 64%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 88% 44%, #9cc8ff 50%, transparent 51%), radial-gradient(1px 1px at 56% 86%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 22% 92%, #c9c2ff 50%, transparent 51%); }
    header { position:relative; display:flex; align-items:center; gap:12px; height:60px; padding:0 22px; border-bottom:1px solid var(--edge); background:rgba(7,8,26,.55); backdrop-filter:blur(12px); }
    .mark { width:32px; height:32px; border-radius:10px; background:linear-gradient(140deg,#1b1f4a,#0a0b22); display:grid; place-items:center; box-shadow:0 0 0 1px rgba(139,123,255,.35), 0 0 22px rgba(124,108,255,.35); }
    header h1 { margin:0; font-size:18px; font-weight:680; letter-spacing:-.02em; background:linear-gradient(100deg,#fff 15%,#cbc3ff 55%,#93c2ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .org { display:flex; align-items:center; gap:7px; padding:4px 11px; border-radius:999px; border:1px solid var(--edge2); color:#d6d9f5; font-size:13px; }
    .org i { width:7px; height:7px; border-radius:50%; background:#3ddc97; box-shadow:0 0 8px #3ddc97; }
    .who { margin-left:auto; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13.5px; }
    .who b { color:var(--text); font-weight:600; }
    .av { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700; }
    main { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 350px; height:calc(100vh - 60px); }
    .chat { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--edge); }
    #thread { flex:1; overflow:auto; padding:22px 0 8px; scroll-behavior:smooth; }
    .wrap { width:min(760px, calc(100% - 56px)); margin:0 auto; }
    .hello { padding:60px 0 10px; text-align:center; }
    .hello h2 { margin:14px 0 6px; font-size:26px; font-weight:680; letter-spacing:-.025em; }
    .hello p { margin:0; color:var(--muted); }
    .q { display:flex; justify-content:flex-end; margin:18px 0 12px; }
    .q div { max-width:80%; padding:10px 15px; border-radius:16px 16px 4px 16px; background:linear-gradient(100deg,#6c5cff,#4f7dff); box-shadow:0 6px 22px rgba(92,100,255,.28); white-space:pre-wrap; }
    .a { display:grid; grid-template-columns:30px minmax(0,1fr); gap:12px; margin:6px 0 22px; }
    .a .m2 { width:30px; height:30px; border-radius:9px; background:linear-gradient(140deg,#1b1f4a,#0a0b22); display:grid; place-items:center; box-shadow:0 0 0 1px rgba(139,123,255,.3); }
    .a .who2 { font-size:13px; font-weight:650; color:#cbc3ff; margin:4px 0 4px; display:flex; gap:8px; align-items:center; }
    .a .who2 span { color:var(--faint); font-weight:500; }
    .body p { margin:0 0 10px; } .body ul, .body ol { margin:0 0 10px; padding-left:20px; } .body li { margin:3px 0; } .body strong { color:#fff; font-weight:650; }
    .body .w { opacity:0; transition:opacity .28s ease; } .body .w.on { opacity:1; }
    .srcs { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .src { display:inline-flex; align-items:center; gap:6px; max-width:330px; padding:4px 10px 4px 8px; border-radius:8px; border:1px solid var(--edge); background:rgba(255,255,255,.04); font-size:12.5px; color:#d3d6f2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transform:translateY(4px); transition:all .35s ease; }
    .src.on { opacity:1; transform:none; }
    .src b { font-weight:700; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; padding:1px 5px; border-radius:4px; }
    .src b.extension { background:rgba(93,139,255,.2); color:#a9c3ff; } .src b.code { background:rgba(61,220,151,.18); color:#7ef0bf; } .src b.digest { background:rgba(246,207,109,.16); color:#f6cf6d; }
    .thinking { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; padding-top:4px; }
    .thinking .sh { background:linear-gradient(90deg,#8d93b8 0%,#fff 45%,#8d93b8 90%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:sh 1.6s linear infinite; font-weight:550; }
    @keyframes sh { from { background-position:200% 0 } to { background-position:-200% 0 } }
    .orb { width:16px; height:16px; border-radius:50%; background:conic-gradient(from 0deg,#8b7bff,#5d8bff,#3ddc97,#8b7bff); animation:spin 1.1s linear infinite; -webkit-mask:radial-gradient(circle,transparent 4px,#000 5px); }
    @keyframes spin { to { transform:rotate(360deg) } }
    .tm { color:var(--faint); font-variant-numeric:tabular-nums; }
    form { padding:14px 0 18px; }
    .box { display:flex; align-items:center; gap:10px; padding:7px 7px 7px 18px; border-radius:16px; border:1px solid var(--edge2); background:rgba(255,255,255,.05); box-shadow:0 10px 40px rgba(0,0,0,.35); transition:border-color .2s, box-shadow .2s; }
    .box:focus-within { border-color:rgba(139,123,255,.7); box-shadow:0 0 0 4px rgba(139,123,255,.15), 0 10px 40px rgba(0,0,0,.35); }
    input { flex:1; padding:9px 0; border:0; background:transparent; color:var(--text); font:inherit; font-size:15.5px; outline:none; }
    input::placeholder { color:var(--faint); }
    button { width:40px; height:40px; border:0; border-radius:12px; display:grid; place-items:center; background:linear-gradient(130deg,#7c6cff,#5d8bff); cursor:pointer; box-shadow:0 4px 14px rgba(108,92,255,.45); }
    aside { display:flex; flex-direction:column; min-height:0; }
    aside h3 { display:flex; align-items:center; gap:8px; margin:0; padding:18px 18px 10px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:650; }
    aside h3 i { width:7px; height:7px; border-radius:50%; background:var(--violet); box-shadow:0 0 10px var(--violet); animation:pulse 2s infinite; }
    @keyframes pulse { 50% { opacity:.35 } }
    #feed { flex:1; overflow:auto; padding:0 14px 14px; }
    .item { padding:12px 13px; margin-bottom:9px; border-radius:13px; border:1px solid var(--edge); background:var(--panel); }
    .item .t { display:flex; gap:9px; align-items:flex-start; font-weight:600; font-size:13.5px; line-height:1.35; }
    .item .t .dot { width:8px; height:8px; min-width:8px; border-radius:50%; margin-top:5px; }
    .item .m { color:var(--muted); font-size:12.5px; margin:4px 0 0 17px; }
    .item .c { font-size:12.5px; margin:6px 0 0 17px; color:#cdd1f0; display:flex; flex-direction:column; gap:2px; }
    .item .c span:before { content:"+ "; color:#7ef0bf; } .item .c span.u:before { content:"~ "; color:#f6cf6d; }
    .new { animation:glow 2.6s ease-out; }
    @keyframes glow { from { border-color:rgba(139,123,255,.95); box-shadow:0 0 0 3px rgba(139,123,255,.25), 0 0 30px rgba(139,123,255,.25); background:rgba(139,123,255,.1); } }
    .empty { color:var(--faint); padding:6px 4px; font-size:13.5px; }
    #cursor { position:fixed; left:0; top:0; width:22px; height:22px; z-index:99; pointer-events:none; transition:transform .55s cubic-bezier(.22,.8,.24,1); filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  </style>
</head>
<body>
  <header>
    <div class="mark"><svg width="19" height="19" viewBox="0 0 128 128"><g stroke="#b3a8ff" stroke-width="7" stroke-linecap="round" fill="none"><path d="M38 30 52 66M90 34 76 58M52 66 64 62 76 58M52 66 42 100M76 58 92 98"/></g><g fill="#fff"><circle cx="38" cy="30" r="9" fill="#ffb27a"/><circle cx="90" cy="34" r="8"/><circle cx="52" cy="66" r="8"/><circle cx="64" cy="62" r="9"/><circle cx="76" cy="58" r="8"/><circle cx="42" cy="100" r="8"/><circle cx="92" cy="98" r="9" fill="#9cc8ff"/></g></svg></div>
    <h1>Orion</h1>
    <div class="org"><i></i><span id="org-name"></span></div>
    <div class="who" id="who"></div>
  </header>
  <main>
    <section class="chat">
      <div id="thread"><div class="wrap" id="msgs"></div></div>
      <form id="ask-form" class="wrap"><div class="box"><input id="ask" data-test="ask" autocomplete="off" placeholder="Ask about anything your org is working on" /><button data-test="send" aria-label="Ask"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button></div></form>
    </section>
    <aside>
      <h3><i></i>New for you</h3>
      <div id="feed"><div class="empty">Nothing new yet.</div></div>
    </aside>
  </main>
  <svg id="cursor" viewBox="0 0 22 22"><path d="M4 2.5v15.2l4.1-3.9 2.7 6 2.9-1.3-2.7-5.9h5.7z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <script>
    const qs = new URLSearchParams(location.search);
    const org = qs.get('org') || 'demo';
    const user = qs.get('user') || '';
    const key = `orion-thread-${org}-${user}`;
    const msgs = document.getElementById('msgs');
    const thread = document.getElementById('thread');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const PALETTE = ['#5b6cff', '#13a37f', '#e0559b', '#f08a24', '#8b5cf6', '#0ea5e9'];
    const colorOf = (s) => PALETTE[[...String(s ?? '')].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 0) % PALETTE.length];
    const MARK = document.querySelector('.mark').innerHTML.replace('width="19" height="19"', 'width="17" height="17"');

    let people = {};
    fetch(`/api/orgs/${org}`).then((r) => r.json()).then(({ org: o, users = [] }) => {
      people = Object.fromEntries(users.map((u) => [u.id, u]));
      const me = people[user];
      document.getElementById('org-name').textContent = o?.name ?? org;
      const n = me?.name ?? user;
      document.getElementById('who').innerHTML = `<span><b>${esc(n)}</b></span><span class="av" style="background:${colorOf(user)}">${esc(n.split(' ').map((w) => w[0]).join('').slice(0, 2))}</span>`;
      if (!msgs.children.length) hello(me);
    });

    function hello(me) {
      msgs.innerHTML = `<div class="hello"><div class="mark" style="width:54px;height:54px;border-radius:16px;margin:0 auto">${MARK.replace('width="17" height="17"', 'width="30" height="30"')}</div><h2>Hi ${esc((me?.name ?? '').split(' ')[0])}, what do you need to know?</h2><p>Orion answers from what your team is working on right now.</p></div>`;
    }

    // Plain text in, light formatting out: paragraphs, bullet and numbered lists, bold.
    function format(text) {
      const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      const out = [];
      let list = null;
      for (const raw of String(text).split('\n')) {
        const line = raw.trim();
        const b = /^[-*•]\s+(.*)/.exec(line), n = /^\d+[.)]\s+(.*)/.exec(line);
        if (b || n) {
          const tag = b ? 'ul' : 'ol';
          if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
          out.push(`<li>${inline((b || n)[1])}</li>`);
          continue;
        }
        if (list) { out.push(`</${list}>`); list = null; }
        if (line) out.push(`<p>${inline(line)}</p>`);
      }
      if (list) out.push(`</${list}>`);
      return out.join('');
    }

    function chips(sources) {
      return (sources ?? []).slice(0, 5).map((s) => `<span class="src"><b class="${esc(s.kind)}">${s.kind === 'extension' ? 'page' : esc(s.kind)}</b>${esc(s.title)}${s.authorName ? ` · ${esc(s.authorName.split(',')[0])}` : ''}</span>`).join('');
    }

    function addQ(text) {
      if (msgs.querySelector('.hello')) msgs.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'q';
      d.innerHTML = `<div>${esc(text)}</div>`;
      msgs.appendChild(d);
    }

    function addA({ text, sources, ms }, { animate = false, test } = {}) {
      const d = document.createElement('div');
      d.className = 'a';
      d.innerHTML = `<div class="m2">${MARK}</div><div><div class="who2">Orion${ms ? `<span>answered in ${(ms / 1000).toFixed(1)}s from ${sources?.length ?? 0} ${sources?.length === 1 ? 'source' : 'sources'}</span>` : ''}</div><div class="body">${format(text)}</div><div class="srcs">${chips(sources)}</div></div>`;
      msgs.appendChild(d);
      const srcs = [...d.querySelectorAll('.src')];
      if (!animate) {
        srcs.forEach((s) => s.classList.add('on'));
        if (test) d.dataset.test = test;
        return Promise.resolve(d);
      }
      // Reveal word by word, the way a streamed answer reads
      const words = [];
      const walk = (node) => {
        for (const child of [...node.childNodes]) {
          if (child.nodeType === 3) {
            const frag = document.createDocumentFragment();
            for (const part of child.textContent.split(/(\s+)/)) {
              if (!part) continue;
              if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); continue; }
              const w = document.createElement('span');
              w.className = 'w';
              w.textContent = part;
              words.push(w);
              frag.appendChild(w);
            }
            child.replaceWith(frag);
          } else walk(child);
        }
      };
      walk(d.querySelector('.body'));
      const per = Math.max(8, Math.min(30, 2600 / Math.max(words.length, 1)));
      return new Promise((resolve) => {
        let i = 0;
        const tick = () => {
          for (let k = 0; k < 2 && i < words.length; k++) words[i++].classList.add('on');
          thread.scrollTop = thread.scrollHeight;
          if (i < words.length) return setTimeout(tick, per * 2);
          srcs.forEach((s, j) => setTimeout(() => s.classList.add('on'), j * 90));
          setTimeout(() => { if (test) d.dataset.test = test; thread.scrollTop = thread.scrollHeight; resolve(d); }, srcs.length * 90 + 150);
        };
        tick();
      });
    }

    const saved = JSON.parse(sessionStorage.getItem(key) || '[]').slice(-4);
    for (const m of saved) m.role === 'me' ? addQ(m.text) : addA(m);
    thread.scrollTop = thread.scrollHeight;
    const remember = (m) => { saved.push(m); sessionStorage.setItem(key, JSON.stringify(saved.slice(-4))); };

    document.getElementById('ask-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('ask');
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      addQ(message);
      remember({ role: 'me', text: message });
      const wait = document.createElement('div');
      wait.className = 'a';
      const started = performance.now();
      wait.innerHTML = `<div class="m2">${MARK}</div><div class="thinking"><span class="orb"></span><span class="sh">Searching ${esc(document.getElementById('org-name').textContent || 'your org')}</span><span class="tm">0.0s</span></div>`;
      msgs.appendChild(wait);
      thread.scrollTop = thread.scrollHeight;
      const timer = setInterval(() => (wait.querySelector('.tm').textContent = `${((performance.now() - started) / 1000).toFixed(1)}s`), 100);
      let m;
      try {
        const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ orgId: org, userId: user, message, currentView: null }) });
        const body = await res.json();
        m = { role: 'orion', text: res.ok ? body.reply : `Error: ${body.error}`, sources: body.sources, ms: performance.now() - started };
      } catch (err) {
        m = { role: 'orion', text: `Error: ${err}`, ms: performance.now() - started };
      }
      clearInterval(timer);
      wait.remove();
      remember(m);
      await addA(m, { animate: true, test: 'reply' });
    });

    const seen = new Set();
    let first = true;
    async function feed() {
      try {
        const res = await fetch(`/api/feed?orgId=${org}&userId=${user}&sinceHours=12&limit=12`);
        const { items = [] } = await res.json();
        if (!items.length) return;
        document.getElementById('feed').innerHTML = items.map((i) => {
          const fresh = !first && !seen.has(i.id);
          seen.add(i.id);
          const changes = i.changes.slice(0, 3).map((c) => `<span class="${c.change === 'created' ? '' : 'u'}">${esc(c.label)}${c.statusFrom && c.statusFrom !== c.statusTo ? ` (${esc(c.statusFrom)} to ${esc(c.statusTo)})` : ''}</span>`).join('');
          return `<div class="item${fresh ? ' new' : ''}"><div class="t"><span class="dot" style="background:${colorOf(i.authorId)}"></span>${esc(i.title)}</div><div class="m">${esc(i.authorName ?? i.kind)} · ${esc(i.why)}</div>${changes ? `<div class="c">${changes}</div>` : ''}</div>`;
        }).join('');
        first = false;
      } catch {}
    }
    feed();
    setInterval(feed, 6000);

    const cur = document.getElementById('cursor');
    const last = JSON.parse(sessionStorage.getItem('cur') || 'null') || { x: innerWidth * 0.5, y: innerHeight * 0.85 };
    const place = (x, y) => { cur.style.transform = `translate(${x - 3}px,${y - 2}px)`; last.x = x; last.y = y; };
    cur.style.transition = 'none'; place(last.x, last.y); requestAnimationFrame(() => requestAnimationFrame(() => (cur.style.transition = '')));
    addEventListener('mousemove', (e) => place(e.clientX, e.clientY), { passive: true });
    addEventListener('pagehide', () => sessionStorage.setItem('cur', JSON.stringify(last)));
  </script>
</body>
</html>
