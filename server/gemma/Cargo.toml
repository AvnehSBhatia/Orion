[package]
name = "orion-gemma"
version = "0.1.0"
edition = "2021"
description = "In-process EmbeddingGemma 2 (text + vision) embedder on onnxruntime, ported from src/llm/gemma.ts"
publish = false

[lib]
name = "orion_gemma"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
ort = { version = "=2.0.0-rc.14" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tracing = "0.1"
ureq = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3
